name: "CI"
on:
  # Branches are tested through their pull request (the merge result);
  # main once more after each merge.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI and publishes its build.
  workflow_call:
permissions:
  contents: read
env:
  php-version: 8.4
  node-version: 24.16.0
  npm-version: 11.13.0
  cache-version: 1
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.php-version }}
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v6
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      # Production vendor/ only: it ships inside the plugin.
      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist --no-dev --optimize-autoloader

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: "Cache NPM dependencies"
        uses: actions/cache@v6
        with:
          path: "~/.npm"
          key: npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Pin npm version"
        run: |
          npm install -g npm@${{ env.npm-version }}

      - name: "Install NPM dependencies"
        run: |
          npm ci --ignore-scripts

      - name: "Build"
        run: |
          npm run build

      # The same files deploy.sh puts on the server.
      - name: "Assemble plugin"
        run: |
          mkdir -p build/avpvh-find-and-view/src
          cp -r avpvh-find-and-view.php readme.txt dist vendor build/avpvh-find-and-view/
          cp -r src/php build/avpvh-find-and-view/src/

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          # The plugin files at the artifact root, as the shared checks expect.
          path: build/avpvh-find-and-view

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.php-version }}
          coverage: none

      - name: "Validate composer.json"
        run: |
          composer validate --strict

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: "Cache NPM dependencies"
        uses: actions/cache@v6
        with:
          path: "~/.npm"
          key: npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Pin npm version"
        run: |
          npm install -g npm@${{ env.npm-version }}

      - name: "Install NPM dependencies"
        run: |
          npm ci --ignore-scripts

      # Stylelint has no config in this repo yet.
      - name: "Typecheck"
        run: |
          npm run lint:ts:typecheck

      - name: "Oxlint"
        run: |
          npm run lint:ts:oxlint

  tests:
    name: "Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.php-version }}
          extensions: gd
          coverage: none

      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}

      - name: "Pin npm version"
        run: |
          npm install -g npm@${{ env.npm-version }}

      - name: "Install NPM dependencies"
        run: |
          npm ci --ignore-scripts

      - name: "Plugin checks"
        run: |
          php tests/plugin-checks.php

      # Headless Chrome comes with the runner image.
      - name: "UI checks"
        run: |
          node tests/ui-checks.mjs

  # PHPUnit with coverage (Codecov) and SonarQube Cloud, shared with the other
  # own plugins. Without SONAR_TOKEN the SonarQube Cloud job is skipped.
  quality:
    name: "Quality"
    uses: grmt/wp-plugin-ci/.github/workflows/quality.yml@feature/vitest-coverage  # TODO: back to @main once wp-plugin-ci#17 is merged
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      sonar-exclusions: "languages/**,local-ocr/**"
      # Vitest for src/ts, with coverage for Codecov and SonarQube Cloud.
      vitest: true

  # Shared with the other own plugins: dependencies on the PHP floor, syntax on
  # 8.4 and 8.5, PHPCompatibility and the WordPress.org Plugin Check.
  plugin-checks:
    name: "Shared"
    needs: build
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: avpvh-find-and-view
      artifact: build-artifact
      ignore-codes: |
        missing_composer_json_file
        PluginCheck.CodeAnalysis.Offloading.OffloadedContent
        plugin_updater_detected
