name: Release Plugin ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/CI.yml

  release:
    name: Publish Release ZIP
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          # The artifact holds the plugin files; the ZIP needs them in a folder.
          path: avpvh-find-and-view

      - name: Build avpvh-find-and-view.zip
        run: |
          zip -r -q avpvh-find-and-view.zip avpvh-find-and-view
          ls -lh avpvh-find-and-view.zip

      - name: Upload ZIP
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: avpvh-find-and-view
          path: avpvh-find-and-view.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" avpvh-find-and-view.zip --clobber
          else
            gh release create "${TAG}" avpvh-find-and-view.zip \
              --title "AVPVH Find and View ${TAG}" \
              --generate-notes
          fi
